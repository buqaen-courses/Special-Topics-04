{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block content %}
<h2><i class="fas fa-plus-circle"></i> Create New Order</h2>

{% if error %}
<div style="background:#fde8e8; color:#a81c1c; padding:0.6rem; border-radius:8px; margin-bottom:1rem;">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
</div>
{% endif %}

<form method="post" action="/orders/create" id="orderForm">
    <div class="card">
        <div class="card-header"><i class="fas fa-user"></i> Select Customer</div>
        <div class="card-body">
            <select name="customer_id" required style="max-width: 400px;">
                <option value="">— Choose customer —</option>
                {% for c in customers %}
                <option value="{{ c.id }}">{{ c.name }} ({{ c.email }})</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><i class="fas fa-box"></i> Add Items</div>
        <div class="card-body" id="itemsContainer">
            <div class="item-row d-flex gap-2" style="margin-bottom: 0.8rem; align-items: end;">
                <div style="flex:2;">
                    <label>Product</label>
                    <select name="product_ids" required>
                        <option value="">— Select product —</option>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} (${{ "%.2f"|format(p.price) }}, stock: {{ p.stock }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div style="flex:1;">
                    <label>Quantity</label>
                    <input type="number" name="quantities" min="1" value="1" required>
                </div>
                <div style="align-self: flex-end;">
                    <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.item-row').remove()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="card-body" style="padding-top: 0;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="addItemRow()">
                <i class="fas fa-plus"></i> Add another item
            </button>
        </div>
    </div>

    <div style="margin-top: 1rem;">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create Order</button>
        <a href="/orders/landing" class="btn btn-secondary">Cancel</a>
    </div>
</form>

<script>
function addItemRow() {
    const container = document.getElementById('itemsContainer');
    const first = container.querySelector('.item-row');
    const clone = first.cloneNode(true);
    clone.querySelectorAll('select, input').forEach(el => el.value = '');
    clone.querySelector('input[name="quantities"]').value = '1';
    container.appendChild(clone);
}
</script>
{% endblock %}
