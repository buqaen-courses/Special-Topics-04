{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'Add' }} Category{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div class="card-header">
        <i class="fas {{ 'fa-pen' if editing else 'fa-plus' }}"></i>
        {{ 'Edit Category' if editing else 'Add New Category' }}
    </div>
    <div class="card-body">
        <form method="post" action="{% if editing %}/categories/{{ category_id }}{% else %}/categories/{% endif %}">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Name</label>
                <input type="text" name="name" required value="{{ category.name if editing else '' }}">
            </div>
            <div class="form-group">
                <label><i class="fas fa-align-left"></i> Description</label>
                <input type="text" name="description" value="{{ category.description if editing else '' }}">
            </div>
            <div class="d-flex gap-2" style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {{ 'Update' if editing else 'Create' }}</button>
                <a href="/categories/landing" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
