<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Product Viewer</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>Product Viewer</h1>
      <p>
        You have <strong>{{ products.length }}</strong> products in the
        database.
      </p>

      <div style="margin: 1rem 0">
        <input
          v-model="search"
          placeholder="Type to search..."
          style="width: 80%; padding: 0.5rem"
        />
        <p>
          <em>You typed: <strong>{{ search }}</strong></em>
        </p>
      </div>

      <h2>Products</h2>

      <table
        border="1"
        style="width: 100%; border-collapse: collapse; margin-top: 0.5rem"
      >
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="p in products" :key="p.id">
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>${{ p.price.toFixed(2) }}</td>
            <td>{{ p.stock }}</td>
          </tr>
        </tbody>
      </table>

      <p v-if="products.length === 0">No products to show yet.</p>
    </div>
    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            username: "Admin",
            search: "",
            products: [      
            ],
          };
        },
        methods: {
          async login() {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: "admin", password: "admin123" }),
            });
            if (!res.ok) throw new Error("Login failed");
          },
          async loadProducts() {
            this.loading = true;
            try {
              const params = new URLSearchParams({
                sort: "id",
                page: 1,
                per_page: 10,
              });
              const res = await fetch(`/api/products?${params}`);
              if (!res.ok) throw new Error("Failed to load products");
              const data = await res.json();
              this.products = data.products;
            } catch (e) {
              console.error("Failed to load products", e);
              this.products = [];
            } finally {
              this.loading = false;
            }
          },
        },
        async created() {
          await this.login(); // Login once — cookie stored by browser
          await this.loadProducts(); // Then load products
        },
      }).mount("#app");
    </script>
  </body>
</html>
