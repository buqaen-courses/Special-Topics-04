{% extends "base.html" %}

{% block title %}{{ 'Edit' if editing else 'Add' }} Member{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <i class="fas {{ 'fa-pen' if editing else 'fa-plus' }}"></i>
        {{ 'Edit Member' if editing else 'Add New Member' }}
    </div>
    <div class="card-body">
        <form method="post" action="{% if editing %}/members/{{ member_id }}{% else %}/members/{% endif %}">

            {% if not editing %}
            <div class="form-group">
                <label><i class="fas fa-id-card"></i> Member ID (auto-generated)</label>
                <input type="text" value="{{ member_id }}" readonly style="background: #e2e8f0;">
            </div>
            {% endif %}

            <div class="form-group">
                <label><i class="fas fa-user"></i> Name</label>
                <input type="text" name="name" required
                       value="{{ member.name if editing else '' }}">
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" required
                       value="{{ member.email if editing else '' }}">
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone</label>
                <input type="text" name="phone"
                       value="{{ member.phone if editing else '' }}"
                       placeholder="e.g. 555-0107">
            </div>

            <div class="d-flex gap-2" style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ 'Update' if editing else 'Create' }}
                </button>
                <a href="/members/landing" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
